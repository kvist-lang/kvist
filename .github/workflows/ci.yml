name: CI

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            exe_suffix: ""
          - os: ubuntu-latest
            exe_suffix: ""
          - os: windows-latest
            exe_suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-08

      - name: Show Odin version
        shell: bash
        run: odin version

      - name: Test Odin toolchain integration
        shell: bash
        env:
          KVIST_TEST_REQUIRE_ODIN_LLVM: "1"
        run: odin test src/odin/kvist_repl -define:ODIN_TEST_LOG_LEVEL=warning -define:ODIN_TEST_THREADS=1

      - name: Run unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: odin test tests -define:ODIN_TEST_LOG_LEVEL=warning -define:ODIN_TEST_THREADS=1

      - name: Run Windows test smoke
        if: runner.os == 'Windows'
        shell: bash
        run: odin test tests -define:ODIN_TEST_LOG_LEVEL=warning -define:ODIN_TEST_THREADS=1 -define:ODIN_TEST_NAMES=tests.compile_hello_program,tests.compile_defstruct_program

      - name: Build CLI
        shell: bash
        run: odin build src/cli/kvist -out:./kvist${{ matrix.exe_suffix }}

      - name: Test ownership runtime invariants
        if: runner.os != 'Windows'
        shell: bash
        run: ./kvist test examples/coverage/packages/ownership-transfer-tests.kvist --track-memory --ownership-audit

      - name: Smoke test CLI
        shell: bash
        run: |
          ./kvist${{ matrix.exe_suffix }} check examples/language/hello.kvist
          test "$(./kvist${{ matrix.exe_suffix }} run examples/language/hello.kvist)" = "hello from kvist"
          test "$(./kvist${{ matrix.exe_suffix }} run examples/collections/package-tour.kvist)" = "18"
          ./kvist${{ matrix.exe_suffix }} doc examples/collections/log-source.kvist log-lines >/dev/null
          ./kvist${{ matrix.exe_suffix }} lookup examples/collections/log-source.kvist log-lines >/dev/null
          ./kvist${{ matrix.exe_suffix }} complete examples/collections/log-source.kvist log >/dev/null

      - name: Test nREPL adapter
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            python scripts/test_nrepl.py
          else
            ./scripts/test_nrepl.sh
          fi
